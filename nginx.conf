server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx's stock mime.types has no .mjs; module workers refuse application/octet-stream
  include /etc/nginx/mime.types;
  types { text/javascript mjs; text/csv csv; }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # hashed build assets never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /hero/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  # open dataset downloads: revalidate so a rebuilt archive is picked up at once
  location /data/ {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    charset utf-8;
    charset_types text/csv application/json;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # hash routing: every path serves the app
  location / {
    try_files $uri /index.html;
  }
}
